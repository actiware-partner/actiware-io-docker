services:
  # Client: io-client-designer
  io-client-designer:
    extends:
      file: base.yml
      service: httpsContainer

    # nginx entrypoint starts as root and drops to uid/gid 101 (nginx user) via setuid/setgid/chown.
    # cap_drop: ALL (from httpsContainer) removes these, so we add them back for all nginx clients.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    image: "${VERSION_IO_CLIENT_DESIGNER:-ghcr.io/actiware-partner/io-designer:3-latest}"
    depends_on:
      - io-identity-service
      - io-project-service
    environment:
      SERVICE__ENDPOINTS__PROJECTSERVICE__NAME: "Default"
      SERVICE__ENDPOINTS__PROJECTSERVICE__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}002"
      SERVICE__ENDPOINTS__PROJECTSERVICE__CLIENTID: "${CLIENT_ID}"
      SERVICE__ENDPOINTS__PROJECTSERVICE__CLIENTSECRET: "${CLIENT_SECRET}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}201:443"

  # Client: io-client-web
  io-client-web:
    extends:
      file: base.yml
      service: httpsContainer

    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    image: "${VERSION_IO_CLIENT_WEB:-ghcr.io/actiware-partner/io-client:3-latest}"
    environment:
      SERVICE__ENDPOINTS__SERVICE__NAME: "Default"
      SERVICE__ENDPOINTS__SERVICE__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012"
      SERVICE__ENDPOINTS__SERVICE__CLIENTID: "${CLIENT_ID}"
      SERVICE__ENDPOINTS__SERVICE__CLIENTSECRET: "${CLIENT_SECRET}"
    depends_on:
      io-identity-service:
        condition: service_started
      io-bff-client-service:
        condition: service_started #Eigentlich healthy, aber er hat keinen Healthcheck
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}202:443"

  io-integration-client:
    extends:
      file: base.yml
      service: httpsContainer

    cap_add:
      - CHOWN
      - SETUID
      - SETGID

    image: "${VERSION_IO_INTEGRATION_CLIENT:-ghcr.io/actiware-partner/io-integration-client:3-latest}"
    environment:
      SERVICE__ENDPOINTS__SERVICE__NAME: "Default"
      SERVICE__ENDPOINTS__SERVICE__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012"
      SERVICE__ENDPOINTS__SERVICE__CLIENTID: "${CLIENT_ID}"
      SERVICE__ENDPOINTS__SERVICE__CLIENTSECRET: "${CLIENT_SECRET}"
    depends_on:
      io-identity-service:
        condition: service_started
      io-bff-client-service:
        condition: service_started #Eigentlich healthy, aber er hat keinen Healthcheck
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}203:443"
