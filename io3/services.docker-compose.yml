  # Service (BFF): io-bff-client-service
  io-bff-client-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_SERVICE_BFF_CLIENT:-ghcr.io/actiware-partner/io-bff-client-service:3-latest}"
    environment:
      <<:
        [
          *dbEnv,
          *logEnv,
          *secureEnv,
          *redisEnv,
          *identityEnv,
          *projectEnv,
          *vaultEnv,
          *objectStoreEnv,
          *aiAgentEnv,
          *aiTranscriptionEnv,
          *clientSrvEnv,
          *docsEnv,
          *workflowEnv,
          *inboxEnv,
          *lookupEnv,
          *integrationFlowEnv,
          *sdkEnv,
          *notificationEnv,
          *webClientPublic,
          *corsEnv,
        ]
      SERVICE__ENDPOINTS__DOCUMENTVIEWER__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}019"
      SERVICE__ENDPOINTS__DOCUMENTVIEWER__SHAREDSECRET: "${CLIENT_SECRET}"
      SERVICE__ENDPOINTS__DOCUMENTVIEWER__MODE: "document_viewer"
      SERVICE__ENDPOINTS__DOCUMENTVIEWER__CALLBACKBASEURL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012"
      # Modul-Proxy: liefert die Oberflächen der Module im Client (Bereiche, Seitenleiste, Tabs), jedes Modul auf eigener Herkunft.
      # Siehe docs/administration/modul-oberflaechen.md. MODULE_ORIGIN_TEMPLATE leer = Proxy aus (Ticket-Route antwortet 503 module_proxy_not_configured).
      MODULEPROXY__MODULEORIGINTEMPLATE: "${MODULE_ORIGIN_TEMPLATE:-}"
      # Herkünfte, die Module einbetten und Tickets holen dürfen (CORS der Ticket-Route). Ohne Eintrag scheitert der Client schon am Preflight.
      MODULEPROXY__ALLOWEDHOSTORIGINS__0: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202"
      MODULEPROXY__ALLOWEDHOSTORIGINS__1: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}203"
      MODULEPROXY__ALLOWEDHOSTORIGINS__2: "${MODULE_PROXY_EXTRA_HOST_ORIGIN:-}"
      # Die Modul-Adressroute des Client Service nimmt nur das Shared Secret an (sonst 503 module_proxy_misconfigured).
      SERVICE__ENDPOINTS__CLIENTSERVICE__SHAREDSECRET: "${SHARED_SECRET}"
      # Anmeldung mit eigenen Zugangsdaten (OpenID je Benutzer, MCP-Anmeldung): Der Callback des BFF leitet auf diese Seite des Web-Clients zurück.
      # Ohne sie antwortet der Callback mit 503 LOGIN_RETURN_NOT_CONFIGURED. Designer > Maintenance > Services > BFF Client Service ersetzt den Wert.
      USERCREDENTIALS__OAUTH__CLIENTRETURNURL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202/credential-oauth-callback.html"
      # Nur wenn der BFF aus dem Internet erreichbar ist: Client ID Metadata Document der MCP-Anmeldung. Dann am Vault MCPCLIENTMETADATADOCUMENTURL setzen.
      # USERCREDENTIALS__OAUTH__PUBLICBASEURL: "https://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012"
      # USERCREDENTIALS__OAUTH__ADDITIONALREDIRECTURIS__0: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201/oauth/test-callback"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}012:443"
    depends_on:
      io-identity-service:
        condition: service_started

