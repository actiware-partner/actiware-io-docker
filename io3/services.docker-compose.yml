  # Service: io-ai-chat-service
  io-ai-chat-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_SERVICE_AI_CHAT:-ghcr.io/actiware-partner/io-ai-chat-service:3-latest}"
    environment:
      <<:
        [
          *dbEnv,
          *logEnv,
          *moduleGrpcEnv,
          *secureEnv,
          *s3Env,
          *redisEnv,
          *identityEnv,
          *projectEnv,
          *vaultEnv,
          *ocrEnv,
          *dataFlowEnv,
          *aiRagEnv,
          *aiTranscriptionEnv,
          *sdkEnv,
          *docsEnv,
          *objectStoreEnv,
          *workflowEnv,
          *integrationFlowEnv,
          *notificationEnv,
          *clientSrvEnv,
          *webClientPublic,
        ]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-ai-chat"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-ai-chat"
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http2"
      # Skill Runner (optional, siehe io-skill-runner am Ende der Datei und docs/administration/skill-runner.md):
      # Adresse und Geheimnis des Runners. Ohne Adresse führen Agenten keine Skripte aus.
      # SKILLRUNNER__ENDPOINTS__0: "http://io-skill-runner:30024"
      # SKILLRUNNER__SHAREDSECRET: "${SKILL_RUNNER_SHARED_SECRET}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}007:443"
    # Skill Runner: Der AiChat hängt zusätzlich am internen Netz des Runners. "default" muss bleiben, sonst erreicht der
