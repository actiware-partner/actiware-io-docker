  SERVICE__ENDPOINTS__IDENTITYSERVICE__SHAREDSECRET: "${SHARED_SECRET}"
  # Herkünfte der Browser-Apps (Designer, Web-Client, Integration-Client) und ADDITIONAL_CLIENT_ORIGINS, siehe x-corsEnv.
  SERVICE__ENDPOINTS__IDENTITYSERVICE__SSOALLOWEDORIGINS: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}203${ADDITIONAL_CLIENT_ORIGINS:+;${ADDITIONAL_CLIENT_ORIGINS}}"
  SERVICE__SSO_ALLOWED_ORIGINS: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}203${ADDITIONAL_CLIENT_ORIGINS:+;${ADDITIONAL_CLIENT_ORIGINS}}"

# CORS der drei Dienste, die der Browser direkt aufruft (BFF Client, Project Service, Identity Service; IO3-4004).
# Abgeleitet aus INSTANCE_HTTP_TYPE, EXTERNALADDRESS und den Client-Ports (Designer 201, Web-Client 202, Integration-Client 203),
# dazu ADDITIONAL_CLIENT_ORIGINS für eigene Kunden-Domains. Dieselbe Liste speist die SSO-Herkünfte in x-identityEnv.
# Siehe docs/administration/client-herkuenfte.md.
x-corsEnv: &corsEnv
  SERVICE__CORS__ALLOWEDORIGINS: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}203${ADDITIONAL_CLIENT_ORIGINS:+;${ADDITIONAL_CLIENT_ORIGINS}}"

x-projectEnv: &projectEnv
  # Pull der Dienst-Einstellungen (Maintenance > Services); das Secret prüft der Project Service gegen SERVICE__ENDPOINTS__IDENTITYSERVICE__SHAREDSECRET.
  SERVICE__ENDPOINTS__PROJECTSERVICE__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}002"
  SERVICE__ENDPOINTS__PROJECTSERVICE__SHAREDSECRET: "${SHARED_SECRET}"

x-bffClientEnv: &bffClientEnv
  # Push der Dienst-Einstellungen an den BFF (gRPC, braucht HTTP/2 am BFF); der BFF prüft das Secret gegen SERVICE__ENDPOINTS__IDENTITYSERVICE__SHAREDSECRET.
  SERVICE__ENDPOINTS__BFFCLIENTSERVICE__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012"
  SERVICE__ENDPOINTS__BFFCLIENTSERVICE__SHAREDSECRET: "${SHARED_SECRET}"

