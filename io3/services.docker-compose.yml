services:
  # Service: io-vault-service
  io-vault-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "actiwareio/io-vault-service:${VERSION_TAG_IO_SERVICE_VAULT:-3-developer}"
    environment:
      <<: [*dbEnv, *secureEnv, *redisEnv, *s3Env, *identityEnv, *vaultEnv, *logEnv]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-vault"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-vault"
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http2"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}000:443"
    depends_on:
      io-identity-service:
        condition: service_started

  # Service: io-identity-service
  io-identity-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "actiwareio/io-identity-service:${VERSION_TAG_IO_SERVICE_IDENTITY:-3-developer}"
    # init is required: without it the healthcheck occasionally times out, leaving behind masses of defunct bash processes
    init: true
    group_add:
      - 0 # needed for Keytab access — not ideal, could be replaced by a script setting permissions to xx4
    environment:
      <<: [*dbEnv, *secureEnv, *redisEnv, *logEnv]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-identity"
      SERVICE__DEFAULT__USERNAME: "${DEFAULT_USER}"
      SERVICE__DEFAULT__PASSWORD: "${DEFAULT_PASS}"
      SERVICE__DEFAULT__WEB_CLIENT_ID: "${CLIENT_ID}"
      SERVICE__DEFAULT__WEB_CLIENT_SECRET: "${CLIENT_SECRET}"
      SERVICE__DEFAULT_VALIDITY_PERIOD: "${DEFAULT_VALIDITY_PERIOD:-86400}"
      SERVICE__SERVER_AUTH__IDENTITY_SERVICE: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}001"
      SERVICE__SERVER_AUTH__SHARED_SECRET: "${SHARED_SECRET}"
      KRB5_KTNAME: "/opt/awio/keytab/krb5.keytab"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}001:443"
    volumes:
      - "/aw/kerberos/:/opt/awio/keytab/"

  # Service: io-project-service
  io-project-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "actiwareio/io-project-service:${VERSION_TAG_IO_SERVICE_PROJECT:-3-developer}"
    environment:
      <<:
        [
          *dbEnv,
          *logEnv,
          *secureEnv,
          *s3Env,
          *redisEnv,
          *identityEnv,
          *vaultEnv,
          *sdkEnv,
          *ocrEnv,
          *workerQueueEnv,
          *clientSrvEnv,
          *aiAgentEnv,
          *aiAgentFunctionsEnv,
          *aiRagEnv,
          *dataFlowEnv,
          *objectStoreEnv,
          *docsEnv,
          *workflowEnv,
          *inboxEnv,
        ]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-project"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-project"
      SERVICE__ASSISTANT__PROVIDER: "${AI_PROVIDER}"
      SERVICE__ASSISTANT__MODEL: "${AI_MODEL}"
      SERVICE__ASSISTANT__APIKEY: "${AI_API_KEY}"
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http1AndHttp2"
      SERVICE__ENDPOINTS__CLIENTSERVICE__SHAREDSECRET: "${SHARED_SECRET}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}002:443"
    depends_on:
      io-identity-service:
        condition: service_started

 #Service: io-ocr-service
  io-ocr-service:
    extends:
      file: base.yml
      service: httpsContainer
    image: "actiwareio/io-ocr-service:${VERSION_TAG_IO_SERVICE_OCR:-3-developer}"
    environment:
      <<: [*dbEnv, *logEnv, *secureEnv, *s3Env, *redisEnv, *identityEnv, *sdkEnv, *vaultEnv, *aiAgentEnv, *aiRagEnv, *workerQueueEnv, *objectStoreEnv, *inboxEnv]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-ocr"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-ocr"
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http2"

      SERVICE__TESSERACT__TESSDATAPATH: "/usr/share/tesseract-ocr/5/tessdata"

      SERVICE__OCR__ENGINE: "${OCR_ENGINE}"
      SERVICE__OCR__PROVIDER: "${OCR_PROVIDER}"
      SERVICE__OCR__MISTRAL__APIKEY: "${MISTRAL_API_KEY}"
      SERVICE__OCR__MISTRAL__MODEL: "${MISTRAL_OCR_MODEL}"

      SERVICE__QUEUES__TICKETS__PROCESSING__QUEUENAME: "default"
      SERVICE__QUEUES__TICKETS__PROCESSING__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__TICKETS__PROCESSING__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__TICKETS__PROCESSING__MAXRETRIES: 3
      SERVICE__QUEUES__TICKETS__PROCESSING__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__TICKETS__PROCESSING__SCHEDULE: "*/1 * * * *"

      SERVICE__QUEUES__TICKETS__RETRY__QUEUENAME: "default"
      SERVICE__QUEUES__TICKETS__RETRY__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__TICKETS__RETRY__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__TICKETS__RETRY__MAXRETRIES: 3
      SERVICE__QUEUES__TICKETS__RETRY__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__TICKETS__RETRY__SCHEDULE: "*/5 * * * *"
      
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__QUEUENAME: "default"
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__MAXRETRIES: 3
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__SCHEDULE: "*/1 * * * *"

      SERVICE__QUEUES__NOTIFICATION__RETRY__QUEUENAME: "default"
      SERVICE__QUEUES__NOTIFICATION__RETRY__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__NOTIFICATION__RETRY__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__NOTIFICATION__RETRY__MAXRETRIES: 3
      SERVICE__QUEUES__NOTIFICATION__RETRY__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__NOTIFICATION__RETRY__SCHEDULE: "*/5 * * * *"    
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}005:443"
    depends_on:
      io-identity-service:
        condition: service_started

