      SERVICE__SUBSCRIBERS__AICHAT__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}007"
      SERVICE__SUBSCRIBERS__AICHAT__SHAREDSECRET: "${SHARED_SECRET}"
      SERVICE__SUBSCRIBERS__OCR__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}005"
      SERVICE__SUBSCRIBERS__OCR__SHAREDSECRET: "${SHARED_SECRET}"
      # Hauptschlüssel für Profile mit der Verschlüsselungsrichtlinie "local", Pflicht: Ein leerer oder ungültiger
      # Schlüssel verhindert den Start. Base64 von 32 Byte (openssl rand -base64 32), nie ändern.
      SERVICE__ENCRYPTION__MASTERKEYS__1: "${TRANSCRIPTION_ENCRYPTION_KEY}"
      # Rotation in zwei Rollouts: erst den neuen Schlüssel zusätzlich eintragen, dann TRANSCRIPTION_ENCRYPTION_ACTIVE_KEY_ID=2.
      # SERVICE__ENCRYPTION__MASTERKEYS__2: "${TRANSCRIPTION_ENCRYPTION_KEY_2}"
      SERVICE__ENCRYPTION__ACTIVEKEYID: "${TRANSCRIPTION_ENCRYPTION_ACTIVE_KEY_ID:-1}"
      # Pseudonyme der Benutzer im Audit (mindestens 32 Byte als Base64). Leer: alle Benutzer erscheinen nur als "Person".
      SERVICE__AUDIT__PSEUDONYMKEY: "${TRANSCRIPTION_AUDIT_PSEUDONYM_KEY:-}"
    ports:
      - "${INSTANCE_PORT_PREFIX}021:443"
    depends_on:
      io-identity-service:
        condition: service_started

