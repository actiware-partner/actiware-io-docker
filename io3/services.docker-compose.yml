        ]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-worker-queue"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-worker-queue"
