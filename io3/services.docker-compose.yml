  SERVICE__MODULEGRPC__SHAREDSECRET: "${MODULE_SHARED_SECRET}"

services:
  # Service: io-vault-service
  io-vault-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_SERVICE_VAULT:-ghcr.io/actiware-partner/io-vault-service:3-latest}"
    environment:
      <<:
        [
          *dbEnv,
          *secureEnv,
          *redisEnv,
          *s3Env,
          *identityEnv,
          *projectEnv,
          *vaultEnv,
          *logEnv,
          *notificationEnv,
          *webClientPublic,
        ]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-vault"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-vault"
      # MCP-Anmeldung: Callback des BFF, Pflicht (ohne ihn: CALLBACK_NOT_CONFIGURED). Designer > Maintenance > Services > Vault Service ersetzt die Werte.
      SERVICE__USERCREDENTIALS__MCPCALLBACKURL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012/api/v3/client/user/credentials/oauth/callback"
      # Rückkehrseite des Designers für "Verbindung testen" (OpenID je Benutzer, MCP-Anmeldung); wird bei MCP-Servern mitregistriert.
      SERVICE__USERCREDENTIALS__TESTLOGINREDIRECTURIS__0: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201/oauth/test-callback"
      # Nur mit USERCREDENTIALS__OAUTH__PUBLICBASEURL am BFF (aus dem Internet erreichbar); ohne registriert sich der Vault selbst beim Autorisierungsserver.
      # SERVICE__USERCREDENTIALS__MCPCLIENTMETADATADOCUMENTURL: "https://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}012/api/v3/client/oauth/client-metadata.json"
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http2"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}000:443"
    depends_on:
      io-identity-service:
        condition: service_started

  # Service: io-identity-service
  io-identity-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_SERVICE_IDENTITY:-ghcr.io/actiware-partner/io-identity-service:3-latest}"
    # init is required: without it the healthcheck occasionally times out, leaving behind masses of defunct bash processes
    init: true
    group_add:
      - 0 # needed for Keytab access - not ideal, could be replaced by a script setting permissions to xx4
    environment:
      <<:
        [*dbEnv, *secureEnv, *redisEnv, *logEnv, *notificationEnv, *identityEnv, *projectEnv, *corsEnv]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-identity"
      SERVICE__DEFAULT__USERNAME: "${DEFAULT_USER}"
      SERVICE__DEFAULT__PASSWORD: "${DEFAULT_PASS}"
      SERVICE__DEFAULT__WEB_CLIENT_ID: "${CLIENT_ID}"
      SERVICE__DEFAULT__WEB_CLIENT_SECRET: "${CLIENT_SECRET}"
      # Installationsschlüssel der Identity für gespeicherte Secrets und Signaturschlüssel (IO3-3489), Pflicht
      SERVICE__SECURITY__IDENTITYENCRYPTIONKEY: "${IDENTITY_ENCRYPTION_KEY}"
      SERVICE__DEFAULT_VALIDITY_PERIOD: "${DEFAULT_VALIDITY_PERIOD:-86400}"
      SERVICE__SERVER_AUTH__IDENTITY_SERVICE: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}001"
      SERVICE__SERVER_AUTH__SHARED_SECRET: "${SHARED_SECRET}"
      # Zusätzlich die eigene Herkunft (:001): Die Anmeldeseite der Identity schickt ihr Formular an /api/v3/login/authorize
      # zurück, und der Browser setzt dabei den Origin-Header. Ohne Eintrag meldet jede Anmeldung "CORS policy execution failed".
      SERVICE__SSO_ALLOWED_ORIGINS: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}203;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}001${ADDITIONAL_CLIENT_ORIGINS:+;${ADDITIONAL_CLIENT_ORIGINS}}"
      # Anmelde-Rücksprungadressen der Clients mit der CLIENT_ID (Designer, Web-Client, Integration-Client, Desktop).
      # Weitere Adressen, z. B. die der Edge-Sidebar, in ADDITIONAL_REDIRECT_URIS (siehe docs/administration/anmelde-adressen.md).
      SERVICE__DEFAULT__WEB_CLIENT_REDIRECT_URIS: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}201/auth/callback;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}202/oauth-callback.html;${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}203/oauth-callback.html;io3://oauth/callback;${ADDITIONAL_REDIRECT_URIS:-}"
      # enforce (Standard) lehnt unbekannte Adressen ab; warn nur für eine kurze Umstellung, siehe Doku
      SERVICE__OAUTH__REDIRECT_URI_CHECK: "${REDIRECT_URI_CHECK:-enforce}"
      KRB5_KTNAME: "/opt/awio/keytab/krb5.keytab"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}001:443"
    volumes:
      - "${KERBEROS_KEYTAB_DIR:-/aw/kerberos}:/opt/awio/keytab/"

  # Service: io-project-service
  io-project-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_SERVICE_PROJECT:-ghcr.io/actiware-partner/io-project-service:3-latest}"
    environment:
      <<:
        [
          *dbEnv,
          *logEnv,
          *moduleGrpcEnv,
          *secureEnv,
          *s3Env,
          *redisEnv,
          *identityEnv,
          *vaultEnv,
          *sdkEnv,
          *ocrEnv,
          *workerQueueEnv,
          *clientSrvEnv,
          *aiAgentEnv,
          *aiAgentFunctionsEnv,
          *aiRagEnv,
          *aiTranscriptionEnv,
          *dataFlowEnv,
          *objectStoreEnv,
          *docsEnv,
          *workflowEnv,
          *inboxEnv,
          *notificationEnv,
          *lookupEnv,
          *integrationFlowEnv,
          *documentViewerEnv,
          *bffClientEnv,
          *corsEnv,
        ]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-project"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-project"
      # AI provider, model and API key are managed via Vault Service (Maintenance > Services > Project Service > Assistant)
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http1AndHttp2"
      SERVICE__ENDPOINTS__CLIENTSERVICE__SHAREDSECRET: "${SHARED_SECRET}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}002:443"
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost:443/system/health/ready"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5      
    depends_on:
      io-identity-service:
        condition: service_started

  #Service: io-ocr-service
  io-ocr-service:
    extends:
      file: base.yml
      service: httpsContainer
    image: "${VERSION_IO_SERVICE_OCR:-ghcr.io/actiware-partner/io-ocr-service:3-latest}"
    environment:
      <<:
        [
          *dbEnv,
          *logEnv,
          *secureEnv,
          *s3Env,
          *redisEnv,
          *identityEnv,
          *projectEnv,
          *sdkEnv,
          *vaultEnv,
          *aiAgentEnv,
          *aiRagEnv,
          *aiTranscriptionEnv,
          *workerQueueEnv,
          *objectStoreEnv,
          *inboxEnv,
          *notificationEnv,
        ]
      SERVICE__DATABASE__DATABASE: "${DATABASE_PREFIX:-io3}-backend-ocr"
      SERVICE__ENDPOINTS__S3__BUCKETNAME: "${S3_BUCKET_NAME_PREFIX}-ocr"
      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http2"

      SERVICE__TESSERACT__TESSDATAPATH: "/usr/share/tesseract-ocr/5/tessdata"

      # OCR engine, provider and Mistral API key are managed via Vault Service (Maintenance > Services > OCR Service)

      SERVICE__QUEUES__TICKETS__PROCESSING__QUEUENAME: "default"
      SERVICE__QUEUES__TICKETS__PROCESSING__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__TICKETS__PROCESSING__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__TICKETS__PROCESSING__MAXRETRIES: 3
      SERVICE__QUEUES__TICKETS__PROCESSING__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__TICKETS__PROCESSING__SCHEDULE: "*/1 * * * *"

      SERVICE__QUEUES__TICKETS__RETRY__QUEUENAME: "default"
      SERVICE__QUEUES__TICKETS__RETRY__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__TICKETS__RETRY__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__TICKETS__RETRY__MAXRETRIES: 3
      SERVICE__QUEUES__TICKETS__RETRY__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__TICKETS__RETRY__SCHEDULE: "*/5 * * * *"

      SERVICE__QUEUES__NOTIFICATION__PROCESSING__QUEUENAME: "default"
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__MAXRETRIES: 3
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__NOTIFICATION__PROCESSING__SCHEDULE: "*/1 * * * *"

      SERVICE__QUEUES__NOTIFICATION__RETRY__QUEUENAME: "default"
      SERVICE__QUEUES__NOTIFICATION__RETRY__MAXDEGREEOFPARALLELISM: 5
      SERVICE__QUEUES__NOTIFICATION__RETRY__POLLINTERVALSECONDS: 10
      SERVICE__QUEUES__NOTIFICATION__RETRY__MAXRETRIES: 3
      SERVICE__QUEUES__NOTIFICATION__RETRY__RETRYSCHEDULE: "*/5 * * * *"
      SERVICE__QUEUES__NOTIFICATION__RETRY__SCHEDULE: "*/5 * * * *"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}005:443"
    depends_on:
      io-identity-service:
        condition: service_started

  # Service: io-worker-queue-service
  io-worker-queue-service:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_SERVICE_WORKER_QUEUE:-ghcr.io/actiware-partner/io-worker-queue-service:3-latest}"
    environment:
      <<:
        [
          *dbEnv,
