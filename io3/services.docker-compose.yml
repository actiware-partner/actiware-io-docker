      KESTREL__ENDPOINTS__HTTPS__PROTOCOLS: "Http2"
      SERVICE__ENDPOINTS__VECTORSTORE__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX:-30}334"
      SERVICE__ENDPOINTS__VECTORSTORE__APIKEY: "${QDRANT_API_KEY}"
      SERVICE__ENDPOINTS__VECTORSTORE__QDRANT__URL: "${INSTANCE_HTTP_TYPE:-https}://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX}334"

      SERVICE__ENDPOINTS__VECTORSTORE__WEAVIATE__APIKEY: "${WEAVIATE_API_KEY}"
      SERVICE__ENDPOINTS__VECTORSTORE__WEAVIATE__URL: "http://${EXTERNALADDRESS}:${INSTANCE_PORT_PREFIX}050"
      SERVICE__ENDPOINTS__VECTORSTORE__WEAVIATE__GRPCPORT: "${INSTANCE_PORT_PREFIX}051"


      # Sync - Scheduler
      SERVICE__SYNC__SCHEDULER__MAXCONCURRENTMANIFESTS: 10
      SERVICE__SYNC__SCHEDULER__STARVATIONTHRESHOLD: 5
      SERVICE__SYNC__SCHEDULER__STARVATIONALERTTHRESHOLD: 10
      SERVICE__SYNC__SCHEDULER__SCHEDULERINTERVAL: "00:01:00"

      # Sync - SourceSync
      SERVICE__SYNC__SOURCESYNC__INTERVAL: "00:00:30"
      SERVICE__SYNC__SOURCESYNC__MAXDEGREEOFPARALLELISM: 3
      SERVICE__SYNC__SOURCESYNC__LOCKDURATION: "00:05:00"

      # Sync - EntryProcessor
      SERVICE__SYNC__ENTRYPROCESSOR__INTERVAL: "00:00:10"
      SERVICE__SYNC__ENTRYPROCESSOR__MAXDEGREEOFPARALLELISM: 5
      SERVICE__SYNC__ENTRYPROCESSOR__ENTRIESPERMANIFEST: 3
      SERVICE__SYNC__ENTRYPROCESSOR__LOCKDURATION: "00:05:00"
      SERVICE__SYNC__ENTRYPROCESSOR__ACKNOWLEDGEBATCHTHRESHOLD: 1000

      # Sync - OcrWorker
      SERVICE__SYNC__OCRWORKER__INTERVAL: "00:00:10"
      SERVICE__SYNC__OCRWORKER__MAXDEGREEOFPARALLELISM: 5
      SERVICE__SYNC__OCRWORKER__BATCHSIZE: 5
      SERVICE__SYNC__OCRWORKER__LOCKDURATION: "00:05:00"
      SERVICE__SYNC__OCRWORKER__CHUNKSIZEBYTES: 65536
      SERVICE__SYNC__OCRWORKER__MAXFILESIZEBYTESPERTICK: 524288000
      SERVICE__SYNC__OCRWORKER__GRPCDEADLINESECONDS: 300

      # Sync - ChunkWorker
      SERVICE__SYNC__CHUNKWORKER__INTERVAL: "00:00:30"
      SERVICE__SYNC__CHUNKWORKER__MAXDEGREEOFPARALLELISM: 5
      SERVICE__SYNC__CHUNKWORKER__BATCHSIZE: 5
      SERVICE__SYNC__CHUNKWORKER__LOCKDURATION: "00:05:00"
      SERVICE__SYNC__CHUNKWORKER__MAXTEXTSIZEBYTESPERTICK: 209715200

      # Sync - EmbeddingWorker
      SERVICE__SYNC__EMBEDDINGWORKER__INTERVAL: "00:00:30"
      SERVICE__SYNC__EMBEDDINGWORKER__MAXDEGREEOFPARALLELISM: 3
      SERVICE__SYNC__EMBEDDINGWORKER__BATCHSIZE: 5
