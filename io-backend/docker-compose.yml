x-defaultHealthCheck:
  healthcheck: &defaultHealthCheck  
    test: ["CMD-SHELL", "exit 0"]
    start_period: 3s
    interval: 5s
    timeout: 3s
    retries: 5
services:
  postgres:
    extends:
      file: base.yml
      service: baseContainer

    image: "${VERSION_IO_BACKEND_POSTGRES:-postgres:18}"

    # TLS: PostgreSQL does NOT activate TLS automatically - ssl=on must be passed explicitly.
    # The key file must not be world-readable (PostgreSQL strict permission check).
    # Solution: start as root, copy certs to tmpfs owned by postgres (uid=999), fix permissions,
    # then exec docker-entrypoint.sh which drops to postgres user (UID 999) via gosu internally.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    tmpfs:
      - /pg-tls:mode=0700,uid=999,gid=999
    entrypoint: ["sh", "-c"]
    command:
      - |
        cp /pg-certs/server.crt /pg-tls/server.crt &&
        cp /pg-certs/server.key /pg-tls/server.key &&
        chmod 600 /pg-tls/server.key /pg-tls/server.crt &&
        chown 999:999 /pg-tls/server.key /pg-tls/server.crt &&
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/pg-tls/server.crt \
          -c ssl_key_file=/pg-tls/server.key \
          -c ssl_ca_file=/aw/CAs/ca.crt \
          -c ssl_min_protocol_version=TLSv1.2 \
          -c listen_addresses='*' \
          -c config_file=/etc/postgresql/awRunAddons/LogsToConsole.conf
    environment:
      LANG: "${LANG_POSTGRES:-en_US.utf8}"
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASS}"
    volumes:
      - "postgres-data:/var/lib/postgresql"
      - ./config/postgres/LogsToConsole.conf:/etc/postgresql/awRunAddons/LogsToConsole.conf
      - type: bind
        source: ${CERT_SERVER_CRT:-/aw/certs/server.crt}
        target: /pg-certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERT_SERVER_KEY:-/aw/certs/server.key}
        target: /pg-certs/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERT_CA_CRT:-/aw/CAs/ca.crt}
        target: /aw/CAs/ca.crt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      <<: [*defaultHealthCheck]
      test: ["CMD", "pg_isready", "--username=${DATABASE_USER}"]
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}432:5432"

  qdrant:
    extends:
      file: base.yml
      service: stumpContainer

    image: "${VERSION_IO_BACKEND_QDRANT:-qdrant/qdrant:v1}"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}333:6333"
      - "${INSTANCE_PORT_PREFIX:-30}334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - "qdrant-data:/qdrant/storage"
      - "./config/qdrant/config/config.yaml:/qdrant/config/production.yaml"
      - "${CERT_DIR:-/aw/certs}:/tls:ro"
      - "${CA_DIR:-/aw/CAs}:/aw/CAs:ro"
    healthcheck:
      disable: true

  redis:
    extends:
      file: base.yml
      service: stumpContainer

    cap_add:
      - DAC_OVERRIDE

    image: "${VERSION_IO_BACKEND_REDIS:-redis:8}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}379:6379"
    volumes:
      - "redis-data:/data"
      - "${CERT_DIR:-/aw/certs}:/tls:ro"
      - "${CA_DIR:-/aw/CAs}:/aw/CAs:ro"
    command: >
      redis-server
        --locale-collate "C"
        --tls-port 6379
        --port 0
        --tls-cert-file /tls/server.crt
        --tls-key-file /tls/server.key
        --tls-ca-cert-file /aw/CAs/ca.crt
        --tls-auth-clients no
    healthcheck:
      <<: [*defaultHealthCheck]
      test: ["CMD", "redis-cli",
             "--tls",
             "--cert", "/tls/server.crt",
             "--key", "/tls/server.key",
             "--cacert", "/aw/CAs/ca.crt",
             "ping"]
      start_period: 10s

  s3:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_BACKEND_S3:-docker.io/pgsty/silo:latest}"
    # MinIO/silo TLS: host key is 664 (world-readable) → silo falls back to HTTP silently.
    # Fix: copy certs to tmpfs with correct permissions, use --certs-dir to bypass HOME detection.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - FOWNER
    tmpfs:
      - /s3-tls:mode=0755
    entrypoint: ["sh", "-c"]
    command:
      - |
        mkdir -p /s3-tls/CAs &&
        cp /certs/server.crt /s3-tls/public.crt &&
        cp /certs/server.key /s3-tls/private.key &&
        cp /aw/CAs/ca.crt /s3-tls/CAs/ca.crt &&
        chmod 640 /s3-tls/private.key &&
        chmod 644 /s3-tls/public.crt /s3-tls/CAs/ca.crt &&
        exec /usr/bin/docker-entrypoint.sh server --certs-dir /s3-tls --console-address ":4901" /data
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}"
    volumes:
      - "s3-data:/data"
    healthcheck:
      <<: [*defaultHealthCheck]
      test: ["CMD-SHELL", "curl -fk https://localhost:9000/minio/health/live"]
      start_period: 10s
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}900:9000"
      - "${INSTANCE_PORT_PREFIX:-30}901:4901"

  solr:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_BACKEND_SOLR:-solr:9}"
    # Port 30983 is exposed via tls-proxy (nginx), not directly here.
    # tls-proxy terminates TLS and forwards plain HTTP to solr:8983.
    expose:
      - 8983
    volumes:
      - "solr-data:/var/solr"
      - "/etc/ssl/certs:/etc/solr/ssl:ro"
    environment:
      SOLR_AUTH_TYPE: basic
      SOLR_AUTHENTICATION_OPTS: "-Dbasicauth=${SOLR_USER}:${SOLR_PASS}"
      SOLR_OPTS: "-XX:-UseLargePages"
      SOLR_HEAP: ${SOLR_HEAP:-1G}
    ulimits:
      nofile:
        soft: 65000
        hard: 65000
    healthcheck:
      <<: [*defaultHealthCheck]
      test:
        [
          "CMD-SHELL",
          "curl -f -u ${SOLR_USER}:${SOLR_PASS} http://localhost:8983/solr/${SOL_BASE_INDEXNAME:-io3-objects}/admin/ping?wt=json",
        ]
    command:
      - bash
      - "-c"
      - "precreate-core io3-objects; exec solr -f"

  weaviate:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_BACKEND_WEAVIATE:-semitechnologies/weaviate:1.38.3}"
    restart: unless-stopped
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}050:8080"
    # gRPC port 50051 is exposed via tls-proxy (nginx), not directly here.
    # tls-proxy terminates TLS and forwards plain HTTP/2 gRPC to weaviate:50051.

    volumes:
      - "weaviate-data:/var/lib/weaviate"

    # TLS: host key is 664 (world-readable) → Weaviate silently skips HTTPS listener.
    # Fix: copy certs to tmpfs with correct permissions (640).
    # Correct flags for Weaviate v1.38.3:
    #   --tls-port sets the HTTPS port (maps to container port 8080)
    #   --tls-certificate / --tls-key enable TLS
    #   Do NOT use --scheme https + --port: that causes a random port (e.g. 41777)
    #   Do NOT use --tls-certificate + --tls-key without --tls-port: also random port
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    tmpfs:
      - /wv-tls:mode=0755
    entrypoint: ["sh", "-c"]
    command:
      - |
        cp /certs/server.crt /wv-tls/server.crt &&
        cp /certs/server.key /wv-tls/server.key &&
        chmod 644 /wv-tls/server.crt &&
        chmod 640 /wv-tls/server.key &&
        exec /bin/weaviate \
          --host 0.0.0.0 \
          --tls-host 0.0.0.0 \
          --tls-port 8080 \
          --tls-certificate /wv-tls/server.crt \
          --tls-key /wv-tls/server.key

    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      CLUSTER_GOSSIP_BIND_PORT: "7101"
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY}"
      AUTHENTICATION_APIKEY_USERS: "admin"
      DEFAULT_VECTORIZER_MODULE: none
      LOG_FORMAT: "text"
      LOG_LEVEL: "info"
      DISABLE_TELEMETRY: "true"
      ENABLE_MODULES: "reranker-transformers"
      RERANKER_INFERENCE_API: "http://reranker-transformers:8080"
      RERANKER_WAIT_FOR_STARTUP: true

    healthcheck:
      disable: true

    depends_on:
      - reranker-transformers

  reranker-transformers:
    extends:
      file: base.yml
      service: httpsContainer
    
    image: "${VERSION_IO_BACKEND_RERANKER:-cr.weaviate.io/semitechnologies/reranker-transformers:baai-bge-reranker-v2-m3}"
    restart: unless-stopped

    environment:
      ENABLE_CUDA: "0"

  tls-proxy:
    # nginx TLS termination proxy for services that cannot natively terminate TLS:
    #   - Weaviate gRPC port 50051 (plain HTTP/2) → host port 30051 (TLS + ALPN h2)
    #   - Solr port 8983 (plain HTTP)             → host port 30983 (TLS)
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}051:50051"
      - "${INSTANCE_PORT_PREFIX:-30}983:8983"
    volumes:
      - "./config/nginx-grpc-proxy/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "${CERT_DIR:-/aw/certs}:/tls:ro"
    depends_on:
      - weaviate
      - solr

volumes:
  postgres-data:
  qdrant-data:
  solr-data:
  s3-data:
  weaviate-data:
  redis-data:
