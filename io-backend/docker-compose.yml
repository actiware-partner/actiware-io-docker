x-defaultHealthCheck:
  healthcheck: &defaultHealthCheck  
    test: ["CMD-SHELL", "exit 0"]
    start_period: 3s
    interval: 5s
    timeout: 3s
    retries: 5
services:
  postgres:
    # Extends baseContainer (not httpsContainer) because PostgreSQL does not use
    # appsettings.ssl.json and has no /app directory. TLS certificates are mounted explicitly below.
    extends:
      file: base.yml
      service: baseContainer

    image: "${VERSION_IO_BACKEND_POSTGRES:-postgres:18}"

    # TLS: PostgreSQL does NOT activate TLS automatically - ssl=on must be passed explicitly.
    # The key file must not be world-readable (PostgreSQL strict permission check).
    # Solution: start as root, copy certs to tmpfs, fix permissions, then exec docker-entrypoint.sh
    # which drops to postgres user (UID 999) via gosu internally. No host changes required.
    # Note: security_opt no-new-privileges is intentionally omitted here because gosu (used by
    # docker-entrypoint.sh to drop from root to postgres) requires setuid, which no-new-privileges blocks.
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    tmpfs:
      - /pg-tls:mode=0700
    entrypoint: ["sh", "-c"]
    command:
      - |
        cp /pg-certs/server.crt /pg-tls/server.crt &&
        cp /pg-certs/server.key /pg-tls/server.key &&
        chmod 600 /pg-tls/server.key /pg-tls/server.crt &&
        chown 999:999 /pg-tls/server.key /pg-tls/server.crt &&
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/pg-tls/server.crt \
          -c ssl_key_file=/pg-tls/server.key \
          -c ssl_ca_file=/aw/CAs/ca.crt \
          -c ssl_min_protocol_version=TLSv1.2 \
          -c config_file=/etc/postgresql/awRunAddons/LogsToConsole.conf
    environment:
      LANG: "${LANG_POSTGRES:-en_US.utf8}"
      POSTGRES_USER: "${DATABASE_USER}"
      POSTGRES_PASSWORD: "${DATABASE_PASS}"
    volumes:
      - "postgres-data:/var/lib/postgresql"
      - ./config/postgres/LogsToConsole.conf:/etc/postgresql/awRunAddons/LogsToConsole.conf
      # Certificates mounted separately (not via httpsContainer) to avoid /app conflict
      - type: bind
        source: ${CERT_SERVER_CRT:-/aw/certs/server.crt}
        target: /pg-certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERT_SERVER_KEY:-/aw/certs/server.key}
        target: /pg-certs/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERT_CA_CRT:-/aw/CAs/ca.crt}
        target: /aw/CAs/ca.crt
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      <<: [*defaultHealthCheck]
      test: ["CMD", "pg_isready", "--username=${DATABASE_USER}"]
    ports:
      # Bound to 127.0.0.1 only: accessible from the host and from io3 (via EXTERNALADDRESS),
      # but not reachable from external networks.
      - "127.0.0.1:${INSTANCE_PORT_PREFIX:-30}432:5432"

  qdrant:
    extends:
      file: base.yml
      service: stumpContainer

    image: "${VERSION_IO_BACKEND_QDRANT:-qdrant/qdrant:v1}"
    environment:
      QDRANT__TELEMETRY_DISABLED: "true" # Disable telemetry for privacy
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}333:6333"
      - "${INSTANCE_PORT_PREFIX:-30}334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - "qdrant-data:/qdrant/storage"
      - "./config/qdrant/config/config.yaml:/qdrant/config/production.yaml"
      - "${CERT_DIR:-/aw/certs}:/tls:ro"
      - "${CA_DIR:-/aw/CAs}:/aw/CAs:ro"
    healthcheck:
      disable: true

  redis:
    extends:
      file: base.yml
      service: stumpContainer

    image: "${VERSION_IO_BACKEND_REDIS:-redis:8}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}379:6379"
    volumes:
      - "redis-data:/data"
      - "${CERT_DIR:-/aw/certs}:/tls:ro"
      - "${CA_DIR:-/aw/CAs}:/aw/CAs:ro"
    command: >
      redis-server
        --locale-collate "C"
        --tls-port 6379
        --port 0
        --tls-cert-file /tls/server.crt
        --tls-key-file /tls/server.key
        --tls-ca-cert-file /aw/CAs/ca.crt
        --tls-auth-clients no
    healthcheck:
      <<: [*defaultHealthCheck]
      test: ["CMD", "redis-cli",
             "--tls",
             "--cert", "/tls/server.crt",
             "--key", "/tls/server.key",
             "--cacert", "/aw/CAs/ca.crt",
             "ping"]
      start_period: 10s

  s3:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_BACKEND_S3:-docker.io/pgsty/silo:latest}"
    volumes:
      - "s3-data:/data"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}"
      # TLS: silo/MinIO activates HTTPS automatically when both cert and key are set.
      # The certificates are already bind-mounted via httpsContainer base at /certs/.
      MINIO_TLS_CERT_FILE: "/certs/server.crt"
      MINIO_TLS_KEY_FILE: "/certs/server.key"
    command: server --console-address ":4901" /data
    healthcheck:
      <<: [*defaultHealthCheck]
      # -k / --insecure: skip cert validation in healthcheck (self-signed CA on host is not in curl's bundle)
      test: ["CMD-SHELL", "curl -fk https://localhost:9000/minio/health/live"]
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}900:9000"
      - "${INSTANCE_PORT_PREFIX:-30}901:4901"

  solr:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_BACKEND_SOLR:-solr:9}"
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}983:8983"
    volumes:
      - "solr-data:/var/solr"
      - "/etc/ssl/certs:/etc/solr/ssl:ro"
    environment:
      SOLR_AUTH_TYPE: basic
      SOLR_AUTHENTICATION_OPTS: "-Dbasicauth=${SOLR_USER}:${SOLR_PASS}"
      # Siehe https://github.com/apache/lucene-solr/pull/2304/files
      SOLR_OPTS: "-XX:-UseLargePages"
      # Siehe: https://tinyurl.com/aw-solr-heap
      SOLR_HEAP: ${SOLR_HEAP:-1G}
    ulimits: # Nicht-Setzen dieser Werte heisst 1024 und das gibt ne dicke Warnung beim SOLR-Start!
      nofile:
        soft: 65000
        hard: 65000
    healthcheck:
      <<: [*defaultHealthCheck]
      test:
        [
          "CMD-SHELL",
          "curl -f -u ${SOLR_USER}:${SOLR_PASS} http://localhost:8983/solr/${SOL_BASE_INDEXNAME:-io3-objects}/admin/ping?wt=json",
        ]
    command:
      - bash
      - "-c"
      - "precreate-core io3-objects; exec solr -f"

  weaviate:
    extends:
      file: base.yml
      service: httpsContainer

    image: "${VERSION_IO_BACKEND_WEAVIATE:-semitechnologies/weaviate:1.38.3}"
    restart: unless-stopped
    ports:
      - "${INSTANCE_PORT_PREFIX:-30}050:8080" # HTTPS/REST
      - "${INSTANCE_PORT_PREFIX:-30}051:50051" # gRPC

    volumes:
      - "weaviate-data:/var/lib/weaviate"
      # TLS certificates for Weaviate (separate mount path to avoid conflict with httpsContainer /certs)
      - "${CERT_DIR:-/aw/certs}/server.crt:/etc/weaviate/tls/server.crt:ro"
      - "${CERT_DIR:-/aw/certs}/server.key:/etc/weaviate/tls/server.key:ro"

    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
      CLUSTER_GOSSIP_BIND_PORT: "7101"
      QUERY_DEFAULTS_LIMIT: "25"

      # Authentication
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: "${WEAVIATE_API_KEY}"
      AUTHENTICATION_APIKEY_USERS: "admin"
      # Objekte werden mit selbst erzeugten Vektoren importiert
      DEFAULT_VECTORIZER_MODULE: none
      LOG_FORMAT: "text"
      LOG_LEVEL: "info"

      # Optional
      DISABLE_TELEMETRY: "true"

      ENABLE_MODULES: "reranker-transformers" # ggf. kommasepariert an bestehende anhaengen
      RERANKER_INFERENCE_API: "http://reranker-transformers:8080"
      RERANKER_WAIT_FOR_STARTUP: true

    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - https
      - --tls-cert-file
      - /etc/weaviate/tls/server.crt
      - --tls-private-key-file
      - /etc/weaviate/tls/server.key
    healthcheck:
      <<: [*defaultHealthCheck]
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost:8080/v1/.well-known/ready || exit 1"]

    depends_on:
      - reranker-transformers

  reranker-transformers:
    extends:
      file: base.yml
      service: httpsContainer
    
    image: "${VERSION_IO_BACKEND_RERANKER:-cr.weaviate.io/semitechnologies/reranker-transformers:baai-bge-reranker-v2-m3}"
    restart: unless-stopped

    environment:
      ENABLE_CUDA: "0"

volumes:
  postgres-data:
  qdrant-data:
  solr-data:
  s3-data:
  weaviate-data:
  redis-data:
