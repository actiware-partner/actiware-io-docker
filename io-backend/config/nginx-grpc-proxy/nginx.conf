worker_processes 1;

events {
    worker_connections 1024;
}

stream {
    upstream weaviate_grpc {
        server weaviate:50051;
    }

    server {
        listen 50051 ssl;

        ssl_certificate     /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # ALPN h2 signalisieren damit .NET gRPC-Client HTTP/2 akzeptiert
        ssl_alpn            h2;

        proxy_pass weaviate_grpc;
    }
}