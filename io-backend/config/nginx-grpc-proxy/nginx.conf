# nginx TLS termination proxy:
#   - Weaviate gRPC :50051 (plain HTTP/2) → TLS mit ALPN h2
#   - Solr          :8983  (plain HTTP)   → TLS
worker_processes 1;

events {
    worker_connections 1024;
}

stream {
    upstream weaviate_grpc {
        server weaviate:50051;
    }

    upstream solr_http {
        server solr:8983;
    }

    server {
        listen 50051 ssl;
        ssl_certificate     /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_alpn            h2;
        proxy_pass weaviate_grpc;
    }

    server {
        listen 8983 ssl;
        ssl_certificate     /tls/server.crt;
        ssl_certificate_key /tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        proxy_pass solr_http;
    }
}